{{- if not .Values.configFiles.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nanoidp.configSecretName" . }}
  labels:
    {{- include "nanoidp.mergedLabels" (dict "context" $) | nindent 4 }}
type: Opaque
stringData:
  # Written verbatim, not templated as structured values, so these read
  # exactly like the users.yaml/settings.yaml files they become. No
  # config_version key here: it must be a literal integer identical
  # between both files, or the load stops with an explicit error.
  users.yaml: |
    {{- .Values.configFiles.users | nindent 4 }}
  settings.yaml: |
    {{- .Values.configFiles.settings | nindent 4 }}
{{- end }}
