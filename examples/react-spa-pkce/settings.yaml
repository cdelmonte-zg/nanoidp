# NanoIDP Settings - React SPA PKCE Integration
# Copy this file to your config directory
# Guide: https://cdelmonte-zg.github.io/nanoidp/use-cases/spa-login-pkce.html

server:
  host: "127.0.0.1"
  # host: "0.0.0.0"  # LAN access is intentionally opt-in (GHSA-2473-px8h-rvg6)
  port: 8000

oauth:
  issuer: "http://localhost:8000"
  audience: "spa-api"  # the access token's aud: the API your SPA calls
  token_expiry_minutes: 60
  clients:
    - client_id: "spa-client"
      token_endpoint_auth_method: "none"  # public client: no secret, PKCE S256 required
      description: "React SPA with PKCE"
      redirect_uris:  # exact string match at /authorize
        - "http://localhost:3000/callback"
        - "http://localhost:5173/callback"  # Vite default port

# CORS: the default dev profile allows every origin; under
# security_profile: stricter-dev it is limited to localhost and 127.0.0.1.

# Authority prefix mapping
authority_prefixes:
  roles: "ROLE_"
  identity_class: "IDENTITY_"
  entitlements: "ENT_"

# Allowed identity classes
allowed_identity_classes:
  - "INTERNAL"
  - "EXTERNAL"
