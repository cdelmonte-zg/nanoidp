# n8n end-to-end stack (#194): nanoidp, the mock protected MCP server, the
# mock chat model and n8n on one network, so a real MCP host authenticates
# against nanoidp and calls a tool, on its own (path 1, the MCP Client node)
# and from inside an AI Agent's tool-calling loop (path 2, the MCP Client Tool
# node). `e2e/n8n_e2e.py` drives both headless; `docker compose up` lets you
# open n8n at http://localhost:5678 and watch the same loops by hand.
#
# Assembly only: every component here is testable on its own (#191 runs the
# mock server without Docker or n8n), and this file carries no logic the
# tests need. The nanoidp image is built from this checkout, so the stack
# exercises the code under test rather than a published release.

services:
  nanoidp:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: nanoidp:agentic-stack
    ports:
      - "8000:8000"
    volumes:
      # Read-only, as in the root docker-compose.yml: saves from the UI or
      # the MCP server fail here by design, configuration is this file.
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The RFC 9728 mock resource server from e2e/, run from the nanoidp image
  # (the mcp SDK and PyJWT it needs are nanoidp dependencies). Its resource
  # URL is its own address on the Compose network: that is the audience every
  # token it accepts must carry.
  mcp:
    image: nanoidp:agentic-stack
    depends_on:
      nanoidp:
        condition: service_healthy
    volumes:
      - ../../e2e/mock_mcp_server.py:/e2e/mock_mcp_server.py:ro
    command:
      - python
      - /e2e/mock_mcp_server.py
      - --issuer
      - http://nanoidp:8000
      - --resource
      - http://mcp:9100/mcp
      - --host
      - "0.0.0.0"
      - --port
      - "9100"
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/.well-known/oauth-protected-resource/mcp')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The OpenAI-compatible mock chat model from e2e/ (path 2), also run from
  # the nanoidp image; it needs nothing but the standard library. It is the
  # AI Agent's "model" in CI: it always asks for the MCP tool, then quotes
  # the tool's answer. No LLM is involved anywhere in the automated run.
  chat:
    image: nanoidp:agentic-stack
    depends_on:
      nanoidp:
        condition: service_healthy
    volumes:
      - ../../e2e/mock_chat_model.py:/e2e/mock_chat_model.py:ro
    command:
      - python
      - /e2e/mock_chat_model.py
      - --host
      - "0.0.0.0"
      - --port
      - "9200"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/v1/models')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Pinned on purpose: n8n's MCP OAuth support (RFC 8707 resource handling,
  # the MCP Client node's authentication options, the session rule on its
  # OAuth callback) has changed across releases. A failure must be
  # attributable to nanoidp or to a known n8n version, so bump this
  # deliberately and re-run e2e/n8n_e2e.py, never float it.
  n8n:
    image: n8nio/n8n:2.38.7
    depends_on:
      mcp:
        condition: service_healthy
      chat:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      N8N_PORT: "5678"
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      # n8n derives its OAuth redirect_uri from WEBHOOK_URL; it must be the
      # URL the browser (or the e2e script) reaches n8n at, and it is the
      # redirect_uri registered on the n8n-public client in config/.
      WEBHOOK_URL: http://localhost:5678/
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      N8N_PUBLIC_API_DISABLED: "false"
      # A fixed key so credentials imported by the e2e script decrypt across
      # restarts. Development only.
      N8N_ENCRYPTION_KEY: agentic-stack-dev-encryption-key
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      # Credentials the e2e script imports with `n8n import:credentials`:
      # the public API refuses an empty clientSecret for mcpOAuth2Api, and a
      # real MCP client holds no secret. The mock chat model's credential
      # travels in the same file.
      - ./n8n-import:/import:ro
    healthcheck:
      # /rest/settings answering JSON, not /healthz and not any 200: n8n
      # 2.38.7 starts in three phases. /healthz is 200 from the first
      # seconds; meanwhile every other path, /rest/settings included, gets
      # a 200 text/html "n8n is starting up" page, then a 404 HTML from the
      # SPA while the REST routes are still unmounted, and only then the
      # JSON body. The nightly run once passed this check on the HTML 200
      # and the e2e script got HTML back from every REST call. `--wait`
      # must mean usable, so the check requires the JSON envelope.
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/rest/settings | grep -q '\"data\"'"]
      interval: 5s
      timeout: 5s
      retries: 40

  # Optional and hands-on only, never in CI: a real local model with tool
  # calling, to run the same agent loop from the n8n editor with something
  # that actually reads the prompt. `docker compose --profile ollama up`,
  # then pull the model named in README.md once; the volume keeps it. No
  # published port: n8n reaches it as http://ollama:11434 on the Compose
  # network, and a host that already runs its own Ollama keeps its 11434.
  ollama:
    image: ollama/ollama:0.34.0
    profiles:
      - ollama
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
