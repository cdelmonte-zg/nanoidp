# NanoIDP Users - Microservices Client Credentials
# Copy this file to your config directory
#
# A client_credentials token is the client's own: its sub is the client_id
# and it carries no user's roles or attributes, so the services below need
# no user at all. This one is for the web UI.

users:
  admin:
    password: "admin"
    email: "admin@example.org"
    roles:
      - "ADMIN"
