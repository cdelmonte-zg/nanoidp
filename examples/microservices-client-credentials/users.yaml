# NanoIDP Users - Microservices Client Credentials
# Copy this file to your config directory

users:
  # The identity every client_credentials token is issued for (#445): a user
  # with no roles, so no human privileges end up in a service's token.
  # Services are told apart by the token's client_id, not by its sub
  service-account:
    email: "service-account@example.org"
    roles: []

  # For the web UI
  admin:
    password: "admin"
    email: "admin@example.org"
    roles:
      - "ADMIN"

default_user: "service-account"
