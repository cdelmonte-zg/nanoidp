# NanoIDP Settings - Microservices Client Credentials
# Copy this file to your config directory
# Guide: https://cdelmonte-zg.github.io/nanoidp/use-cases/service-to-service-client-credentials.html

server:
  host: "127.0.0.1"
  # host: "0.0.0.0"  # LAN access is intentionally opt-in (GHSA-2473-px8h-rvg6)
  port: 8000

oauth:
  issuer: "http://localhost:8000"
  # The aud of a token requested without a resource: accepted by no service
  audience: "microservices"
  token_expiry_minutes: 60
  # Every scope a client may ask for must be in the vocabulary
  scopes_supported:
    - openid
    - profile
    - email
    - offline_access
    - orders:read
    - inventory:read
    - inventory:reserve
  clients:
    # Calls the inventory API: reads stock, reserves items
    - client_id: "order-service"
      client_secret: "order-service-secret"
      description: "Order management microservice"
      allowed_scopes: [inventory:read, inventory:reserve]
      allowed_resources: ["https://inventory.internal"]

    # Calls the orders API: reads orders to notify about them
    - client_id: "notification-service"
      client_secret: "notification-service-secret"
      description: "Notification delivery microservice"
      allowed_scopes: [orders:read]
      allowed_resources: ["https://orders.internal"]
