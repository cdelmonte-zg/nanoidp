[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanoidp"
version = "3.0.0"
description = "A lightweight, configurable Identity Provider for development and testing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Christian Del Monte" }
]
keywords = [
    "identity-provider",
    "idp",
    "oauth2",
    "oidc",
    "saml",
    "authentication",
    "testing",
    "development",
    "mock",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "Flask>=3.0.0",
    "Flask-Cors>=6.0.2",
    "Flask-Limiter>=4.1.1",
    # Direct API use since #314 (limits.parse validates the rate string at
    # the config boundary); was only transitive via Flask-Limiter.
    "limits>=3.0",
    # >=2.13.0: /userinfo and /introspect pass a client-supplied token to
    # jwt.decode(), and 2.8.0-2.12.1 are affected by CVE-2026-48525 (unbounded
    # Base64URL decode of a b64=false detached JWS payload -> DoS).
    "PyJWT>=2.13.0",
    # Floor is set by signxml: signxml 4.2.2 imports x509.verification.ExtensionPolicy
    # (added in cryptography 45.0.0) at module load, though it only declares >=43.
    # Our own API usage would be happy far lower - do not raise without a real reason.
    "cryptography>=45.0.0",
    "lxml>=6.0.2",
    "signxml>=4.2.0",
    "PyYAML>=6.0",
    # Comment/quote-preserving round-trip YAML, used only on the config write path.
    "ruamel.yaml>=0.18",
    # <3 is deliberate: mcp 1.x -> 2.0 was a breaking rewrite of the lowlevel Server.
    "mcp>=2,<3",
    "pydantic>=2.12",
    "bcrypt>=5.0.0",
    # Used directly by mcp_server.call_tool() to validate arguments against a
    # tool's input_schema; mcp 2.0's on_call_tool no longer does this itself.
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "black>=25.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-PyYAML",
    "types-jsonschema",
    "requests>=2.31.0",  # e2e/test_agent.py (e2e)
    "import-linter>=2.1",  # wildcard forbidden_modules; architectural import contracts (#149), see [tool.importlinter]
]

[project.scripts]
nanoidp = "nanoidp.__main__:main"
nanoidp-mcp = "nanoidp.mcp_server:main"

[project.urls]
Homepage = "https://cdelmonte-zg.github.io/nanoidp/"
Documentation = "https://cdelmonte-zg.github.io/nanoidp/"
Repository = "https://github.com/cdelmonte-zg/nanoidp.git"
Issues = "https://github.com/cdelmonte-zg/nanoidp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nanoidp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/config",
    "/README.md",
    "/LICENSE",
]

# Architectural import contracts (#149), enforced by `lint-imports` in CI.
# The package layering is routes -> services -> config -> serialization/models;
# higher layers may import lower ones, never the reverse. The only declared
# back-edge is serialization -> config, which exists purely under
# TYPE_CHECKING so config.py can import serialization at runtime without a
# cycle; exclude_type_checking_imports keeps those annotations-only edges out
# of the graph so the contracts describe runtime dependencies.
[tool.importlinter]
root_package = "nanoidp"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "serialization has no runtime package imports"
type = "forbidden"
source_modules = ["nanoidp.serialization"]
# Every sibling in the package, not a hand-picked list: the invariant is "no
# runtime import from the package at all" (models included - today it is a
# TYPE_CHECKING import, and turning it into a runtime one is the likeliest
# regression). Wildcards need import-linter >= 2.1.
forbidden_modules = ["nanoidp.*"]

[[tool.importlinter.contracts]]
name = "layers: routes -> services -> config"
type = "layers"
layers = [
    "nanoidp.routes",
    "nanoidp.services",
    "nanoidp.config",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
# Baseline from #55, ratcheted to full annotation coverage in #70: every def
# in src/ is annotated and stays that way.
python_version = "3.10"
files = ["src"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Only these dependencies ship no type stubs; keeping the list explicit (vs a
# global ignore_missing_imports) means a new untyped import gets flagged
# instead of silently ignored.
module = [
    "lxml.*",
    "signxml.*",
    "flask_cors.*",
    "flask_limiter.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# MCPDeprecationWarning subclasses UserWarning; fail rather than log if we ever
# start using a deprecated SDK surface.
filterwarnings = ["error::mcp.MCPDeprecationWarning"]
