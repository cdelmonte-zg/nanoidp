# Runs the example of the "Test service-to-service auth with client
# credentials" use-case page (examples/microservices-client-credentials):
# NanoIDP from this checkout with the preset, the Spring Boot inventory API
# built from inventory-api/, and the service calls against both, so the page
# cannot drift from what works.
name: Client credentials example

on:
  pull_request:
    paths:
      - "examples/microservices-client-credentials/**"
      - ".github/workflows/client-credentials-example.yml"
      - "src/nanoidp/**"
  push:
    branches: [main]
    paths:
      - "examples/microservices-client-credentials/**"
      - ".github/workflows/client-credentials-example.yml"
      - "src/nanoidp/**"
  workflow_dispatch:

jobs:
  inventory-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/microservices-client-credentials
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: pip install ../.. pytest requests

      - name: Start NanoIDP with the preset
        run: |
          mkdir -p idp-config && cp settings.yaml users.yaml idp-config/
          python -m nanoidp --config ./idp-config > nanoidp.log 2>&1 &
          timeout 30 sh -c 'until curl -fsS --max-time 2 http://localhost:8000/api/health; do sleep 1; done' \
            || { cat nanoidp.log; exit 1; }

      - name: Build and start the inventory API
        run: |
          (cd inventory-api && mvn -B -q package -DskipTests)
          java -jar inventory-api/target/inventory-api-1.0.jar > api.log 2>&1 &
          timeout 120 sh -c 'until grep -q "Started InventoryApplication" api.log; do sleep 1; done' \
            || { cat api.log; exit 1; }

      - run: pytest -v tests

      - if: failure()
        run: cat nanoidp.log api.log
