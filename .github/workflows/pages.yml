# Build the mdBook documentation site and publish it to GitHub Pages.
#
# The book source lives in book/src (with the canonical docs symlinked in, so
# there is a single source of truth); mdBook renders it to book/book. Pages
# must be enabled once in the repo settings (Settings -> Pages -> Source:
# GitHub Actions).
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "examples/ci-github-actions/**"
      - "examples/spring-boot-saml/**"
      - "examples/microservices-client-credentials/**"
      - "examples/cli-device-flow/**"
      - "docs/**"
      - "VISION.md"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook
        run: |
          version=0.4.52
          url="https://github.com/rust-lang/mdBook/releases/download/v${version}/mdbook-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "$url" | tar -xz -C /usr/local/bin

      - name: Build the book
        run: cd book && mdbook build

      # mdBook does not emit a sitemap, so list the rendered chapters: the
      # canonical URLs meant to be found. The site root stands for index.html
      # and introduction.html, which render the same chapter; 404, print, toc
      # and the Search Console verification file are not pages; vision,
      # contributing and the changelog are not pages people arrive at.
      - name: Generate the sitemap
        run: |
          base="https://cdelmonte-zg.github.io/nanoidp/"
          cd book/book
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            echo "  <url><loc>${base}</loc></url>"
            find . -name '*.html' \
              ! -path './index.html' ! -path './404.html' ! -path './print.html' \
              ! -path './toc.html' ! -path './google*.html' \
              ! -path './introduction.html' ! -path './project/vision.html' \
              ! -path './project/contributing.html' ! -path './project/changelog.html' \
              | sed 's|^\./||' | sort \
              | while read -r page; do echo "  <url><loc>${base}${page}</loc></url>"; done
            echo '</urlset>'
          } > sitemap.xml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
