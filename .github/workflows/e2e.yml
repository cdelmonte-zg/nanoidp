# End-to-end checks that the unit suite structurally cannot cover (#79):
# the HTTP agent drives a real server over the network, and the MCP smoke
# test drives the real stdio server - the transport whose startup crash
# once went unnoticed because unit tests call _execute_tool directly (#56).
name: E2E

on:
  pull_request:
    branches: [main, "stack/**"]
  push:
    branches: [main]

jobs:
  http-e2e:
    runs-on: ubuntu-latest
    # The agent has per-request timeouts, but a wedged server or a hung
    # login flow would otherwise burn the 360-minute Actions default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # The reference plugin, installed the way a user would: the entry
          # point must be discovered from a real package (#185).
          pip install examples/plugins/nanoidp-echo

      - name: Start server
        # Bootstrap surface exercised for real: the echo plugin through
        # NANOIDP_BOOTSTRAP_PLUGIN + NANOIDP_PLUGIN_ECHO_RECORD, and a shell
        # on_config_saved hook through config/bootstrap.yaml (the unit suite
        # registers plugins in-process; this is the only place the installed
        # package and the env/bootstrap.yaml path are tested end to end).
        env:
          NANOIDP_BOOTSTRAP_PLUGIN: echo
          NANOIDP_PLUGIN_ECHO_RECORD: ${{ github.workspace }}/echo-record.jsonl
        run: |
          printf 'hooks:\n  on_config_saved: "echo saved {kind} {path} >> %s/hooks.log"\n' "$PWD" > config/bootstrap.yaml
          python -m nanoidp > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && exit 0
            sleep 1
          done
          echo "server did not become healthy" >&2
          cat server.log >&2
          exit 1

      - name: Run e2e agent
        env:
          NANOIDP_E2E_HOOK_LOG: ${{ github.workspace }}/hooks.log
          NANOIDP_E2E_PLUGIN: echo
          NANOIDP_E2E_PLUGIN_RECORD: ${{ github.workspace }}/echo-record.jsonl
        run: python e2e/test_agent.py

      - name: Start oauth21 server
        run: |
          PORT=8001 python -m nanoidp --profile oauth21 > server-oauth21.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8001/api/health && exit 0
            sleep 1
          done
          echo "oauth21 server did not become healthy" >&2
          cat server-oauth21.log >&2
          exit 1

      - name: Run oauth21 profile suite
        run: python e2e/test_agent.py --oauth21 --url http://localhost:8001

      - name: Prepare signed-SAML config
        run: |
          python e2e/gen_sp_keypair.py --out e2e-saml
          cp -r config e2e-saml/config
          python - <<'EOF'
          import yaml
          path = "e2e-saml/config/settings.yaml"
          with open(path) as f:
              doc = yaml.safe_load(f)
          doc.setdefault("saml", {})["want_authn_requests_signed"] = True
          doc["saml"]["sp_certificates"] = ["e2e-saml/sp-cert.pem"]
          with open(path, "w") as f:
              yaml.safe_dump(doc, f, sort_keys=False)
          EOF

      - name: Start signed-SAML server
        run: |
          PORT=8002 NANOIDP_CONFIG_DIR=e2e-saml/config python -m nanoidp > server-saml.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8002/api/health && exit 0
            sleep 1
          done
          echo "signed-SAML server did not become healthy" >&2
          cat server-saml.log >&2
          exit 1

      - name: Run signed-AuthnRequests suite
        run: |
          python e2e/test_agent.py --saml-signed --url http://localhost:8002 \
            --sp-key e2e-saml/sp-key.pem --sp-cert e2e-saml/sp-cert.pem

      - name: Prepare MCP-interop config
        # nanoidp needs the three tool scopes in its vocabulary, and its
        # issuer must equal the URL it actually runs at, because the mock MCP
        # server derives the JWKS URL from the issuer (#191).
        run: |
          cp -r config e2e-mcp-config
          python - <<'EOF'
          import yaml
          path = "e2e-mcp-config/settings.yaml"
          doc = yaml.safe_load(open(path))
          oauth = doc.setdefault("oauth", {})
          oauth["issuer"] = "http://localhost:8003"
          oauth["scopes_supported"] = [
              "openid", "profile", "email", "offline_access",
              "documents:read", "documents:write", "admin",
          ]
          yaml.safe_dump(doc, open(path, "w"), sort_keys=False)
          EOF

      - name: Start MCP-interop nanoidp and mock MCP server
        run: |
          PORT=8003 NANOIDP_CONFIG_DIR=e2e-mcp-config python -m nanoidp > server-mcp.log 2>&1 &
          python e2e/mock_mcp_server.py             --issuer http://localhost:8003             --resource http://localhost:9100/mcp             --port 9100 > mock-mcp.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8003/api/health               && curl -sf http://localhost:9100/.well-known/oauth-protected-resource/mcp               && exit 0
            sleep 1
          done
          echo "MCP-interop servers did not become healthy" >&2
          cat server-mcp.log mock-mcp.log >&2
          exit 1

      - name: Run OAuth/MCP interoperability suite
        run: |
          python e2e/test_agent.py --url http://localhost:8003             --mcp http://localhost:9100/mcp

      - name: Server log on failure
        if: failure()
        run: |
          cat server.log
          echo "===== oauth21 server ====="
          cat server-oauth21.log 2>/dev/null || true
          echo "===== signed-SAML server ====="
          cat server-saml.log 2>/dev/null || true
          echo "===== MCP-interop nanoidp ====="
          cat server-mcp.log 2>/dev/null || true
          echo "===== mock MCP server ====="
          cat mock-mcp.log 2>/dev/null || true

  mcp-e2e:
    runs-on: ubuntu-latest
    # stdio has no request timeouts: if the server starts but hangs in
    # initialize/list_tools/call_tool, only this job timeout saves the run.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install examples/plugins/nanoidp-echo

      - name: MCP stdio smoke test
        env:
          NANOIDP_BOOTSTRAP_PLUGIN: echo
          NANOIDP_PLUGIN_ECHO_RECORD: ${{ github.workspace }}/echo-record-mcp.jsonl
          NANOIDP_E2E_PLUGIN: echo
        run: python e2e/mcp_smoke_test.py --config ./config
