name: Tests

on:
  pull_request:
    branches: [main, "stack/**"]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Type-check with mypy
        run: |
          mypy src

      - name: Check import contracts
        run: |
          lint-imports

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: |
          # Threshold ratchets upward only (#71); 70 at introduction (73%
          # measured), 75 after #72 covered the wizard (78% measured).
          pytest tests/ --cov=nanoidp --cov-report=term-missing --cov-fail-under=75

  windows-smoke:
    # A top-level unconditional `import fcntl` in config_writer.py once
    # broke `import nanoidp.config`/`nanoidp.app` outright on Windows
    # (#229 review round 8) - every other job here runs on ubuntu-latest
    # and never caught it, even though pyproject.toml declares
    # `Operating System :: OS Independent`. This is the minimum guard:
    # import the package, then run the lock backend's own test suite
    # (it exercises the fcntl/msvcrt dispatch this regression was in).
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import the package
        run: python -c "import nanoidp.app"

      - name: Run the config_writer test suite
        run: pytest tests/test_config_writer.py -v --tb=short

  license-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies only
        run: |
          python -m pip install --upgrade pip
          # Only the redistributed closure: dev tools (black, mypy, pytest) are
          # not shipped, so their licenses are out of scope for redistribution.
          pip install -e .
          pip install pip-licenses

      - name: List dependency licenses
        run: pip-licenses --with-authors --with-urls --format=markdown

      - name: Fail on copyleft licenses blocked by the dependency-license policy
        run: |
          # nanoidp ships under MIT. The project's dependency-license policy
          # blocks strong/network copyleft (GPL, LGPL, AGPL, SSPL, EUPL) from
          # shipping without explicit human review: redistributing such a
          # dependency in an MIT work carries conditions that need a conscious
          # decision, so the gate stops the build until someone makes it. Weak
          # per-file copyleft (MPL-2.0, already present via certifi) is allowed
          # and intentionally not listed.
          # "General Public License" catches the GPL/LGPL/AGPL full names;
          # "GPL" catches their acronym spellings. --partial-match is required:
          # without it --fail-on only matches a license string in full.
          pip-licenses --partial-match --fail-on="General Public License;GPL;SSPL;Server Side Public License;EUPL;European Union Public Licence"
