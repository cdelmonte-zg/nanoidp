# Runs the example of the "Test a Spring Boot SAML service provider" use-case
# page (examples/spring-boot-saml): NanoIDP from this checkout with the preset,
# the Spring Boot SP built from sp/, and a login driven through both, so the
# page cannot drift from what works.
name: SAML example

on:
  pull_request:
    paths:
      - "examples/spring-boot-saml/**"
      - ".github/workflows/saml-example.yml"
      - "src/nanoidp/routes/saml.py"
      - "src/nanoidp/services/saml*.py"
  push:
    branches: [main]
    paths:
      - "examples/spring-boot-saml/**"
      - ".github/workflows/saml-example.yml"
      - "src/nanoidp/routes/saml.py"
      - "src/nanoidp/services/saml*.py"
  workflow_dispatch:

jobs:
  spring-boot-sp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/spring-boot-saml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: pip install ../.. pytest requests

      - name: Start NanoIDP with the preset
        run: |
          mkdir -p idp-config && cp settings.yaml users.yaml idp-config/
          python -m nanoidp --config ./idp-config > nanoidp.log 2>&1 &
          timeout 30 sh -c 'until curl -fsS --max-time 2 http://localhost:8000/api/health; do sleep 1; done' \
            || { cat nanoidp.log; exit 1; }

      - name: Build and start the Spring Boot SP
        run: |
          (cd sp && mvn -B -q package -DskipTests)
          java -jar sp/target/nanoidp-saml-sp-1.0.jar > sp.log 2>&1 &
          timeout 120 sh -c 'until grep -q "Started SpApplication" sp.log; do sleep 1; done' \
            || { cat sp.log; exit 1; }

      - run: pytest -v tests

      - if: failure()
        run: cat nanoidp.log sp.log
