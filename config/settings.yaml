server:
  host: 127.0.0.1
  port: ${PORT:8000}
  debug: false
oauth:
  issuer: http://localhost:${PORT:8000}
  audience: my-app
  token_expiry_minutes: 60
  clients:
  - client_id: demo-client
    client_secret: demo-secret
    description: Default demo client for development
  - client_id: test-client
    client_secret: test-secret
    description: Test client for integration tests
  - client_id: multi-aud-client
    client_secret: multi-aud-secret
    description: Client whose ID Token carries extra audiences (array aud + azp)
    additional_audiences:
    - https://api.example.com
    - urn:service:billing
  - client_id: registered-client
    client_secret: registered-secret
    description: 'Client with registered redirect URIs (exact matching, issue #67)'
    redirect_uris:
    - http://localhost:3000/callback
  - client_id: branded-client
    client_secret: branded-secret
    description: Demo client with custom login page branding
    background_color: '#2c3e50'
    header_color: '#3498db'
    footer_color: '#e8f4f8'
    show_client_id: true
    show_description: true
  - client_id: ui-native
    client_secret: 's'
    description: ''
    show_client_id: false
    redirect_uris:
    - com.example.app:/oauth2redirect
    - http://127.0.0.1:0/callback
  - client_id: scoped-client
    client_secret: scoped-secret
    description: 'Client restricted to a scope subset (issue #186)'
    allowed_scopes:
    - openid
    - profile
  issuer_from_request: false
  issuer_from_proxy_headers: false
  # logos_dir: ./static/logos  # optional override; defaults to src/nanoidp/static/logos
saml:
  # entity_id / sso_url: absent = derived from the effective issuer as
  # <issuer>/saml and <issuer>/saml/sso (follows issuer_from_request); set
  # them only to pin a fixed value
  # entity_id: http://localhost:${PORT:8000}/saml
  # sso_url: http://localhost:${PORT:8000}/saml/sso
  default_acs_url: http://localhost:8080/login/saml2/sso/nanoidp
  sign_responses: true
  c14n_algorithm: exc_c14n
  strict_binding: false
  # Roles/groups are not standard SAML attributes; enable and name them here.
  export_roles: false
  export_groups: false
  roles_attr_name: roles
  groups_attr_name: groups
jwt:
  algorithm: RS256
  keys_dir: ./keys
authority_prefixes:
  roles: ROLE_
  groups: GROUP_
  identity_class: IDENTITY_
  entitlements: ENT_
allowed_identity_classes:
- INTERNAL
- EXTERNAL
session:
  secret_key: dev-secret-key-change-in-production
  permanent: true
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  log_token_requests: true
  log_saml_requests: true
